# ~/.config/foot/foot.ini

include=~/.config/foot/themes/rose-pine

font=JetBrainsMono Nerd Font:size=12

dpi-aware=no

pad=5x5
resize-by-cells=yes
selection-target=clipboard

[scrollback]
lines=10000
multiplier=3

[cursor]
style=beam
blink=no

[mouse]
hide-when-typing=yes

[url]
launch=xdg-open ${url}
osc8-underline=url-mode
