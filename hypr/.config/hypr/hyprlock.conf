# ~/.config/hypr/hyprlock.conf

source = $HOME/.config/hypr/rose-pine.conf

$accent = $iris
$font = JetBrainsMono Nerd Font

$textHex = e0def4
$irisHex = c4a7e7
$muteHex = 908caa

general {
    hide_cursor = true
    grace = 2
    ignore_empty_input = true
    immediate_render = true
}

# uncomment if you set up fingerprint reader
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.6     
    vibrancy = 0.17
}

input-field {
    monitor =
    size = 600, 60
    outline_thickness = 3
    rounding = 15

    inner_color = rgba(0, 0, 0, 0.0)
    outer_color = $accent
    check_color = $foam
    fail_color = $love
    capslock_color = $gold
    numlock_color = $pine
    font_color = $text

    fade_on_empty = false
    font_family = $font

    placeholder_text = <span foreground="##$muteHex"><i>󰌾 Logged in as </i><span foreground="##$irisHex">$USER</span></span>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>

    dots_size = 0.2
    dots_spacing = 0.2

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 90
    font_family = $font
    shadow_passes = 2
    shadow_size = 4

    position = 0, 25%
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $subtle
    font_size = 25
    font_family = $font

    position = 0, 17%
    halign = center
    valign = center
}

# KEYBOARD LAYOUT
label {
    monitor =
    text = $LAYOUT[en,ru]
    color = $foam
    font_size = 24
    font_family = $font
    onclick = hyprctl switchxkblayout all next

    position = 250, -20
    halign = center
    valign = center
}

# UPTIME — small, unobtrusive, tells you if the box rebooted while away
label {
    monitor =
    text = cmd[update:60000] uptime -p
    color = $muted
    font_size = 14
    font_family = $font

    position = 0, 60
    halign = center
    valign = bottom
}

# POWER CONTROLS 
label {
    monitor =
    text = suspend
    color = $gold
    font_size = 16
    font_family = $font
    onclick = sleep 1 && systemctl suspend

    position = -140, 25
    halign = center
    valign = bottom
}

label {
    monitor =
    text = reboot
    color = $foam
    font_size = 16
    font_family = $font
    onclick = sleep 1 && systemctl reboot

    position = 0, 25
    halign = center
    valign = bottom
}

label {
    monitor =
    text = shutdown
    color = $love
    font_size = 16
    font_family = $font
    onclick = sleep 1 && systemctl poweroff

    position = 140, 25
    halign = center
    valign = bottom
}
