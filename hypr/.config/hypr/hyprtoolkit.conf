# ~/.config/hypr/hyprtoolkit.conf

source = $HOME/.config/hypr/rose-pine.conf

background        = $base
base              = $surface
alternate_base    = $overlay
text              = $text
bright_text       = $rose
accent            = $iris
accent_secondary  = $foam

font_size         = 11
small_font_size   = 10
h1_size           = 19
h2_size           = 15
h3_size           = 13

icon_theme = rose-pine-icons

font_family = JetBrainsMono Nerd Font
