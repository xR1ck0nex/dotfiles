# ~/.config/yazi/yazi.toml

[mgr]
ratio           = [1, 4, 3]   
sort_by         = "natural"   
sort_sensitive  = false
sort_reverse    = false
sort_dir_first  = true
linemode        = "size"      
show_hidden     = false       
show_symlink    = true
scrolloff       = 5
title_format    = "yazi: {cwd}"

[preview]
wrap          = "no"
tab_size      = 2
max_width     = 1200          
max_height    = 1200
image_filter  = "lanczos3"    
image_quality = 80

[open]
prepend_rules = [
  { mime = "text/*",           use = ["edit", "open"] },
  { mime = "application/json", use = ["edit", "open"] },
  { mime = "inode/directory",  use = ["open"] },
]

[plugin]
# Flavours and plugins install with `ya pkg add <repo>` (older versions:
# `ya pack -a`). Check `ya pkg --help` for the syntax your build uses.

[tasks]
micro_workers = 10
macro_workers = 25
